# FitTrack Spring Boot Configuration
spring.application.name=fittrack-backend
server.port=8081

# H2 Database Configuration (In-Memory Database for College Viva & Postman Testing)
spring.datasource.url=jdbc:h2:mem:fittrackdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Web Console Enable
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Hibernate JPA Settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Token Settings
jwt.secret=9a2f8c4e7b1a5d3f8e6c4b2a9f1e7d3c5b8a4f6e2d9c1b7a5f3e8d2c6b4a1f9e
jwt.expiration=86400000
